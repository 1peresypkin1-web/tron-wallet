<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>TRON Wallet v0.3</title><link rel="stylesheet" href="style.css"></head>
<body><main><header><div><h1>TRON Wallet <small>v0.3</small></h1><p>MAINNET · несколько кошельков · локальная подпись</p></div><button id="lock" class="hidden">Заблокировать</button></header>
<section id="auth" class="card"><h2 id="authTitle"></h2><div id="newFields"><label>Имя кошелька</label><input id="firstName" value="Основной"><label>Private key</label><input id="firstPk" type="password"></div><label>Пароль vault</label><input id="password" type="password"><button id="authBtn">Продолжить</button></section>
<section id="app" class="layout hidden"><aside class="card side"><div class="sideHead"><h2>Кошельки</h2><button id="addBtn">+</button></div><div id="walletList"></div></aside><div>
<section class="card"><div class="row"><div><h2 id="activeName"></h2><code id="address"></code></div><button id="refresh">Обновить</button></div><div class="stats"><div><span>TRX</span><b id="trx">—</b></div><div><span>USDT</span><b id="usdt">—</b></div><div><span>⚡ Energy</span><b id="energy">—</b><small id="energyLimit"></small></div><div><span>📡 Bandwidth</span><b id="bandwidth">—</b><small id="bandwidthLimit"></small></div></div></section>
<section class="card"><h2>Отправить</h2><button class="token active" data-token="TRX">TRX</button><button class="token" data-token="USDT">USDT</button><label>Получатель</label><input id="to" placeholder="T..."><label>Сумма</label><input id="amount"><p id="resourceHint" class="warn">TRX использует Bandwidth.</p><button id="send">Проверить и отправить</button></section><section id="result" class="card hidden"></section></div></section>
<dialog id="addDialog"><h2>Добавить кошелёк</h2><label>Имя</label><input id="addName"><label>Private key</label><input id="addPk" type="password"><button id="cancelAdd">Отмена</button><button id="confirmAdd">Добавить</button></dialog><div id="status"></div></main><script src="renderer.js"></script></body></html>
