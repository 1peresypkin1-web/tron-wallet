<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>TRON Wallet</title><link rel="stylesheet" href="style.css"></head><body><main><header><div><h1>TRON Wallet</h1><p>MAINNET · local signing</p></div><button id="lock" class="hidden">Заблокировать</button></header><section id="auth" class="card"><h2 id="title"></h2><div id="imp"><label>Private key</label><input id="pk" type="password"></div><label>Пароль vault</label><input id="pass" type="password"><button id="go">Продолжить</button><p id="hint"></p></section><section id="wallet" class="hidden"><div class="card"><button id="refresh">Обновить</button><p>Адрес</p><code id="address"></code><div class="balances"><div>TRX <b id="trx">—</b></div><div>USDT <b id="usdt">—</b></div></div></div><div class="card"><h2>Отправить</h2><button class="tok active" data-t="TRX">TRX</button> <button class="tok" data-t="USDT">USDT</button><label>Получатель</label><input id="to" placeholder="T..."><label>Сумма</label><input id="amount"><p class="warn">MAINNET: проверьте адрес и сумму. Транзакции необратимы. USDT требует Energy/TRX для комиссии.</p><button id="send">Проверить и отправить</button></div><div id="result" class="card hidden"></div></section><div id="msg"></div></main><script src="renderer.js"></script></body></html>
